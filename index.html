<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habitual">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0d0d'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23c9a84c'%3E🌱%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Habitual%22%2C%22short_name%22%3A%22Habitual%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%2520viewBox%3D'0%25200%2520100%2520100'%253E%253Crect%2520width%3D'100'%2520height%3D'100'%2520rx%3D'22'%2520fill%3D'%25230d0d0d'%2F%253E%253Ctext%2520x%3D'50'%2520y%3D'68'%2520font-size%3D'58'%2520text-anchor%3D'middle'%2520fill%3D'%2523c9a84c'%253E%25F0%259F%258C%25B1%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230d0d0d%22%2C%22theme_color%22%3A%22%230d0d0d%22%7D">
<title>Habitual</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--bg4:#252525;
  --text:#f0ede6;--text2:#b8b0a0;--text3:#6b6358;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --gold:#c9a84c;--gold-bg:rgba(201,168,76,0.12);--gold-dk:#8a6a1f;
  --green:#4caf7d;--green-bg:rgba(76,175,125,0.12);
  --blue:#5b9bd5;--blue-bg:rgba(91,155,213,0.12);
  --red:#c97b5a;--red-bg:rgba(201,123,90,0.12);
  --r:10px;--rl:14px;--pill:999px;
  --nav-h:60px;--safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;font-family:-apple-system,'Hiragino Sans','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
#app{max-width:430px;margin:0 auto;height:100dvh;height:var(--app-height);display:flex;flex-direction:column;overflow:hidden;position:relative;overflow:hidden;}
.topbar{flex-shrink:0;background:rgba(13,13,13,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid var(--border);padding:calc(env(safe-area-inset-top,0px) + 8px) 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.tb-left .tb-app{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:1px;}
.tb-left .tb-title{font-size:18px;font-weight:600;color:var(--text);letter-spacing:-0.2px;}
.tb-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.exp-pill{display:flex;align-items:center;gap:5px;background:var(--gold-bg);border:0.5px solid rgba(201,168,76,0.3);border-radius:var(--pill);padding:4px 10px;}
.exp-pill i{font-size:12px;color:var(--gold);}
.exp-val{font-size:12px;font-weight:600;color:var(--gold);}
.rank-tag{font-size:10px;color:var(--text3);letter-spacing:0.04em;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.nav{flex-shrink:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;background:rgba(13,13,13,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid var(--border);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:10px;letter-spacing:0.03em;font-family:inherit;transition:color .15s;padding:0;}
.nav-btn i{font-size:21px;}
.nav-btn.active{color:var(--gold);}
.nav-dot{width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:0;transition:opacity .15s;}
.nav-btn.active .nav-dot{opacity:1;}
.screen{display:none;}
.screen.active{display:block;animation:fadeUp .18s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);padding:16px 18px 8px;}
.hero-card{position:relative;margin:12px 14px 0;border-radius:var(--rl);overflow:hidden;min-height:200px;}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0a0e1a 0%,#1a1228 40%,#0d1a12 100%);}
.hero-stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,0.6) 0%,transparent 100%),radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,0.4) 0%,transparent 100%),radial-gradient(1px 1px at 50% 60%,rgba(255,255,255,0.3) 0%,transparent 100%),radial-gradient(1px 1px at 10% 70%,rgba(255,255,255,0.5) 0%,transparent 100%),radial-gradient(1px 1px at 90% 80%,rgba(255,255,255,0.3) 0%,transparent 100%),radial-gradient(1px 1px at 65% 15%,rgba(255,255,255,0.5) 0%,transparent 100%),radial-gradient(1px 1px at 75% 50%,rgba(255,255,255,0.3) 0%,transparent 100%),radial-gradient(1px 1px at 25% 45%,rgba(255,255,255,0.4) 0%,transparent 100%);}
.hero-content{position:relative;z-index:1;padding:18px 18px 16px;}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.hero-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(201,168,76,0.7);}
.hero-refresh{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.3);font-size:16px;padding:2px;}
.hero-quote{font-size:16px;font-weight:500;color:var(--text);line-height:1.65;letter-spacing:0.01em;margin-bottom:16px;font-style:italic;}
.hero-divider{height:0.5px;background:rgba(255,255,255,0.1);margin-bottom:14px;}
.hero-person{display:flex;align-items:center;gap:12px;}
.hero-avatar{width:40px;height:40px;border-radius:50%;background:var(--gold-bg);border:1px solid rgba(201,168,76,0.3);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--gold);flex-shrink:0;}
.hero-person-info{flex:1;min-width:0;}
.hero-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:1px;}
.hero-bio{font-size:11px;color:var(--text3);line-height:1.4;}
.hero-expand{background:none;border:none;cursor:pointer;color:var(--gold);font-size:11px;letter-spacing:0.05em;padding:0;font-family:inherit;white-space:nowrap;}
.person-detail{margin:8px 14px 0;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;display:none;}
.person-detail.open{display:block;}
.pd-head{padding:14px 16px;border-bottom:0.5px solid var(--border);}
.pd-title{font-size:13px;font-weight:600;color:var(--gold);margin-bottom:3px;}
.pd-years{font-size:11px;color:var(--text3);}
.pd-body{padding:14px 16px;}
.pd-sec-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
.pd-text{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:12px;}
.pd-knowledge{background:var(--bg3);border-radius:var(--r);padding:12px 14px;}
.pd-k-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
.pd-k-text{font-size:13px;color:var(--text2);line-height:1.6;}
.level-card{margin:8px 14px 0;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rl);padding:13px 15px;}
.lv-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.lv-info{display:flex;align-items:center;gap:10px;}
.lv-badge{width:38px;height:38px;border-radius:var(--r);background:var(--gold-bg);border:0.5px solid rgba(201,168,76,0.3);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--gold);}
.lv-name{font-size:13px;font-weight:600;color:var(--text);}
.lv-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.lv-pct{font-size:12px;font-weight:600;color:var(--text3);}
.lv-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.lv-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold-dk),var(--gold));transition:width .8s cubic-bezier(.25,.8,.25,1);}
.streak-row{display:flex;gap:8px;padding:8px 14px 0;}
.streak-box{flex:1;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rl);padding:11px 13px;display:flex;align-items:center;justify-content:space-between;}
.streak-val{font-size:22px;font-weight:600;color:var(--text);line-height:1;}
.streak-lbl{font-size:10px;color:var(--text3);margin-top:3px;}
.goal-row{display:flex;align-items:center;gap:11px;padding:11px 18px;background:var(--bg2);border-bottom:0.5px solid var(--border);}
.goal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.goal-body{flex:1;min-width:0;}
.goal-name{font-size:14px;font-weight:500;color:var(--text);margin-bottom:1px;}
.goal-sub{font-size:11px;color:var(--text3);}
.goal-track{height:2px;background:var(--bg3);border-radius:1px;margin-top:6px;overflow:hidden;}
.goal-fill{height:100%;border-radius:1px;transition:width .5s cubic-bezier(.25,.8,.25,1);}
.rec-pill{font-size:11px;font-weight:500;border:0.5px solid var(--border2);border-radius:var(--pill);padding:5px 12px;background:none;color:var(--text2);cursor:pointer;white-space:nowrap;font-family:inherit;}
.rec-pill.done{background:var(--gold);color:#000;border-color:var(--gold);}
.add-row{display:flex;align-items:center;gap:10px;padding:12px 18px;cursor:pointer;color:var(--text3);font-size:13px;}
.challenge-card{margin:0 14px 8px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rl);padding:13px 14px;}
.challenge-card.done{opacity:.45;}
.challenge-top{display:flex;align-items:center;gap:11px;margin-bottom:8px;}
.challenge-icon{width:34px;height:34px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.challenge-body{flex:1;min-width:0;}
.challenge-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:1px;}
.challenge-desc{font-size:11px;color:var(--text3);}
.challenge-exp{font-size:11px;font-weight:600;color:var(--gold);background:var(--gold-bg);border-radius:var(--pill);padding:3px 9px;white-space:nowrap;flex-shrink:0;}
.challenge-done-badge{font-size:11px;font-weight:600;color:var(--green);background:var(--green-bg);border-radius:var(--pill);padding:3px 9px;white-space:nowrap;flex-shrink:0;}
.challenge-prog{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.challenge-prog-fill{height:100%;border-radius:2px;transition:width .5s;}
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;}
.cal-month{font-size:16px;font-weight:600;color:var(--text);}
.cal-arr{background:none;border:none;cursor:pointer;color:var(--text3);font-size:22px;padding:4px;line-height:1;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 10px;}
.cal-dow{text-align:center;font-size:10px;color:var(--text3);padding:5px 0;letter-spacing:.04em;}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r);font-size:13px;color:var(--text3);gap:3px;cursor:pointer;}
.cal-day.today{background:var(--gold);color:#000;font-weight:600;}
.cal-day.selected:not(.today){background:var(--bg3);border:0.5px solid var(--border2);color:var(--text);}
.cal-day.has-log{color:var(--text2);}
.pip{width:3px;height:3px;border-radius:50%;background:var(--gold);display:none;}
.cal-day.has-log .pip{display:block;}
.cal-day.today .pip{background:rgba(0,0,0,0.4);}
.day-log-header{padding:14px 18px 8px;}
.day-log-date{font-size:13px;font-weight:600;color:var(--text);}
.day-log-empty{padding:14px 18px;font-size:13px;color:var(--text3);}
.day-log-row{display:flex;align-items:flex-start;gap:10px;padding:10px 18px;background:var(--bg2);border-bottom:0.5px solid var(--border);}
.day-log-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.day-log-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:1px;}
.day-log-val{font-size:11px;color:var(--text3);}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 14px;margin-top:12px;}
.stat-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rl);padding:12px 13px;}
.stat-l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.stat-v{font-size:24px;font-weight:600;color:var(--text);}
.week-report{margin:10px 14px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rl);padding:16px;}
.wr-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.wr-title{font-size:13px;font-weight:600;color:var(--text);}
.wr-period{font-size:11px;color:var(--text3);}
.wr-bars{display:flex;align-items:flex-end;gap:4px;height:56px;margin-bottom:6px;}
.wr-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.wr-bar{width:100%;border-radius:3px 3px 0 0;background:var(--bg3);min-height:2px;}
.wr-bar.on{background:linear-gradient(180deg,var(--gold),var(--gold-dk));}
.wr-dl{font-size:9px;color:var(--text3);}
.goal-report-card{margin:0 14px 8px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rl);padding:13px 14px;}
.gr-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.gr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.gr-name{font-size:13px;font-weight:500;color:var(--text);}
.gr-days{font-size:11px;color:var(--text3);margin-left:auto;}
.gr-track{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.gr-fill{height:100%;border-radius:2px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding-bottom:calc(24px + var(--safe-b));max-height:90dvh;overflow-y:auto;animation:slideUp .25s cubic-bezier(.32,1.1,.6,1);border-top:0.5px solid var(--border);}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sh-handle{width:36px;height:3px;background:var(--border2);border-radius:2px;margin:12px auto 14px;}
.sh-head{padding:0 20px 12px;border-bottom:0.5px solid var(--border);}
.sh-title{font-size:17px;font-weight:600;color:var(--text);}
.sh-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.sh-body{padding:16px 20px 0;}
.fl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
.fi{width:100%;padding:11px 13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--text);font-size:16px;font-family:inherit;margin-bottom:15px;outline:none;transition:border-color .15s;}
.fi:focus{border-color:var(--gold);}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px;}
.chip{padding:6px 14px;border-radius:var(--pill);border:0.5px solid var(--border2);font-size:12px;color:var(--text2);background:none;cursor:pointer;font-family:inherit;}
.chip.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600;}
.swatch-row{display:flex;gap:9px;margin-bottom:15px;}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.swatch.on{outline:2px solid var(--gold);outline-offset:2px;}
.sh-actions{display:flex;gap:10px;padding:15px 20px 0;}
.btn-main{flex:1;background:var(--gold);color:#000;border:none;border-radius:var(--r);padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-ghost{flex:1;background:none;border:0.5px solid var(--border2);border-radius:var(--r);padding:13px;font-size:15px;color:var(--text2);cursor:pointer;font-family:inherit;}
.settings-block{margin:0 14px 1px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;}
.settings-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:0.5px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-icon-wrap{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.settings-label-wrap{flex:1;min-width:0;}
.settings-label{font-size:14px;color:var(--text);}
.settings-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.theme-toggle{width:44px;height:26px;border-radius:13px;background:var(--bg3);border:0.5px solid var(--border2);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.theme-toggle.on{background:var(--gold);}
.theme-knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.theme-toggle.on .theme-knob{transform:translateX(18px);}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-6px);background:var(--gold);color:#000;border-radius:var(--pill);padding:8px 18px;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:200;max-width:calc(100% - 32px);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="tb-left">
      <div class="tb-app">Habitual</div>
      <div class="tb-title" id="tb-title">Today</div>
    </div>
    <div class="tb-right">
      <div class="exp-pill"><i class="ti ti-bolt"></i><span class="exp-val" id="exp-disp">0 EXP</span></div>
      <div class="rank-tag" id="rank-tag">Lv.1 · 下忍</div>
    </div>
  </div>
  <div class="content" id="content">
    <div id="s-today" class="screen active">
      <div class="hero-card">
        <div class="hero-bg"></div><div class="hero-stars"></div>
        <div class="hero-content">
          <div class="hero-top">
            <span class="hero-label">今日の一言</span>
            <button class="hero-refresh" onclick="nextPerson()"><i class="ti ti-refresh"></i></button>
          </div>
          <div class="hero-quote" id="hero-quote"></div>
          <div class="hero-divider"></div>
          <div class="hero-person">
            <div class="hero-avatar"><i class="ti ti-user"></i></div>
            <div class="hero-person-info">
              <div class="hero-name" id="hero-name"></div>
              <div class="hero-bio" id="hero-bio"></div>
            </div>
            <button class="hero-expand" onclick="toggleDetail()">詳しく →</button>
          </div>
        </div>
      </div>
      <div class="person-detail" id="person-detail">
        <div class="pd-head"><div class="pd-title" id="pd-name"></div><div class="pd-years" id="pd-years"></div></div>
        <div class="pd-body">
          <div class="pd-sec-label">プロフィール</div>
          <div class="pd-text" id="pd-profile"></div>
          <div class="pd-knowledge"><div class="pd-k-label">今日の知識</div><div class="pd-k-text" id="pd-knowledge"></div></div>
        </div>
      </div>
      <div class="level-card">
        <div class="lv-row">
          <div class="lv-info">
            <div class="lv-badge" id="lv-badge">1</div>
            <div><div class="lv-name" id="lv-name-txt">下忍</div><div class="lv-sub" id="lv-sub-txt">次のレベルまで — EXP</div></div>
          </div>
          <div class="lv-pct" id="lv-pct-txt">0%</div>
        </div>

function getChallengesForWeek(){
  // 週ごとに週次チャレンジ3つ+永続チャレンジを表示
  const wk=getWeekKey();
  const seed=wk.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const weekly=CHALLENGE_POOL.filter(c=>!c.once);
  const picked=[];
  for(let i=0;i<3;i++){picked.push(weekly[(seed+i*7)%weekly.length]);}
  const permanent=CHALLENGE_POOL.filter(c=>c.once);
  return {weekly:picked, permanent};
}
function checkChallengeProgress(c, stats, logs){
  const now=new Date();
  if(c.type==='total_logs') return {done:stats.totalLogs>=c.target, progress:Math.min(stats.totalLogs,c.target), total:c.target};
  if(c.type==='level') return {done:stats.level>=c.target, progress:Math.min(stats.level,c.target), total:c.target};
  if(c.type==='streak') return {done:stats.streak>=c.target, progress:Math.min(stats.streak,c.target), total:c.target};
  if(c.type==='streak_week'){
    // 今週7日すべて
    let cnt=0;
    for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-d.getDay()+i);const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;if(logs[k]&&Object.keys(logs[k]).length>0)cnt++;}
    return {done:cnt>=7,progress:cnt,total:7};
  }
  if(c.type==='days_week'){
    let cnt=0;
    for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-d.getDay()+i);const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;if(logs[k]&&Object.keys(logs[k]).length>0)cnt++;}
    return {done:cnt>=c.target,progress:cnt,total:c.target};
  }
  if(c.type==='all_goals_day'){
    let best=0;
    for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;if(logs[k])best=Math.max(best,Object.keys(logs[k]).length);}
    const t=Math.max(goals.length,1);
    return {done:best>=t,progress:Math.min(best,t),total:t};
  }
  if(c.type==='week_exp'){
    // 今週獲得EXP（簡易：今週の記録数×20）
    let cnt=0;
    for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-d.getDay()+i);const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;if(logs[k])cnt+=Object.keys(logs[k]).length;}
    const exp=cnt*20;
    return {done:exp>=c.target,progress:Math.min(exp,c.target),total:c.target};
  }
  if(c.type==='morning_logs'){
    let cnt=0;
    for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-d.getDay()+i);const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;if(logs[k])cnt+=Object.keys(logs[k]).length;}
    return {done:cnt>=c.target,progress:Math.min(cnt,c.target),total:c.target};
  }
  return {done:false,progress:0,total:1};
}

  {name:'ウォルト・ディズニー',years:'1901-1966',bio:'エンターテイメントの魔法使い',quote:'夢を見る力がある者は、それを実現する力もある。',profile:'ミッキーマウスの生みの親であり、ウォルト・ディズニー・カンパニーの共同創業者。ディズニーランドを設立し、夢と魔法の世界を生み出した。',knowledge:'ウォルト・ディズニーは生涯に22のアカデミー賞を受賞した。これは一個人として最多記録。'},
  {name:'ナポレオン・ボナパルト',years:'1769-1821',bio:'フランス皇帝・軍事的天才',quote:'不可能とは、小さな人間が大きな力を持つ者を罵るために使う言葉だ。',profile:'フランス革命後の混乱を収束させ、ヨーロッパの大部分を支配した。ナポレオン法典を制定し、近代法律の基礎を築いた。',knowledge:'ナポレオンは遠征中も常に本を携帯し、6万冊以上の本を読んだといわれている。'},
  {name:'ヘンリー・フォード',years:'1863-1947',bio:'フォード・モーター創業者',quote:'できると思えばできる。できないと思えばできない。どちらも正しい。',profile:'T型フォードをベルトコンベア方式で大量生産して自動車を庶民に普及させた。週40時間労働制の導入にも貢献した。',knowledge:'フォードは小学校しか卒業していないが、アメリカで最も裕福な人物のひとりになった。'},
  {name:'マリア・キュリー',years:'1867-1934',bio:'ノーベル賞2度受賞の物理学者',quote:'人生に恐れるものは何もない。ただ理解するものがあるだけだ。',profile:'放射能の研究で1903年にノーベル物理学賞、1911年にノーベル化学賞を受賞。ノーベル賞を2つの異なる科学分野で受賞した唯一の人物。',knowledge:'キュリーの研究ノートは今も放射能を帯びており、鉛の箱に保管されている。'},
  {name:'ピーター・ドラッカー',years:'1909-2005',bio:'経営学者・マネジメントの父',quote:'未来を予測する最善の方法は、未来を創り出すことだ。',profile:'現代のマネジメント理論の基礎を築き、「マネジメントの父」と呼ばれる。「目標管理」「知識労働者」などの概念を提唱した。',knowledge:'ドラッカーは生涯に39冊の本を書き、最後の著作を95歳で完成させた。'},
  {name:'アリストテレス',years:'紀元前384-322年',bio:'古代ギリシャの哲学者',quote:'人は習慣によってつくられる。卓越性は行動ではなく習慣だ。',profile:'プラトンの弟子であり、アレクサンドロス大王の家庭教師。論理学・倫理学・政治学・生物学など多くの分野で著作を残した。',knowledge:'アリストテレスは史上初めて動物を体系的に分類した。500種以上の動物を観察・記録し「動物誌」を著した。'},
  {name:'ソクラテス',years:'紀元前470-399年',bio:'古代ギリシャの哲学者',quote:'吟味されない人生は生きる価値がない。',profile:'自ら著書を書かず、対話によって真理を探求した。「無知の知」という概念で知られ、アテナイ市民に問いを投げかけ続けた。',knowledge:'ソクラテスは裁判で有罪判決を受けた後、弟子たちの逃亡の勧めを断り、法に従って毒杯をあおって死んだ。'},
  {name:'ウォーレン・バフェット',years:'1930年生まれ',bio:'投資家・バークシャー・ハサウェイCEO',quote:'成功への道はいつも工事中だ。',profile:'「オマハの賢人」の愛称で知られ、長期投資で財を成した。世界有数の富豪でありながら質素な生活を続けることで知られる。',knowledge:'バフェットは11歳で初めて株を買い、13歳から確定申告をしていた。'},
  {name:'レオナルド・ダ・ヴィンチ',years:'1452-1519',bio:'万能の天才・芸術家・科学者',quote:'シンプルさは究極の洗練さだ。',profile:'モナリザや最後の晩餐を描いた芸術家でありながら、飛行機・戦車・ヘリコプターの原型となるアイデアを設計図に残した科学者。',knowledge:'ダ・ヴィンチは左利きで鏡文字を使って7000ページ以上のノートを残した。全ては今も発見されていない。'},
  {name:'マーティン・ルーサー・キング',years:'1929-1968',bio:'公民権運動の指導者',quote:'今日の勇気が明日の伝説になる。',profile:'非暴力主義によって黒人差別撤廃運動を指導し、「I Have a Dream」の名演説を行った。1964年にノーベル平和賞を受賞。',knowledge:'キング牧師はわずか39歳で暗殺された。しかし彼の誕生日はアメリカの祝日となっている。'},
  {name:'ネルソン・マンデラ',years:'1918-2013',bio:'南アフリカ大統領',quote:'それは常に不可能に見える、達成されるまでは。',profile:'27年間投獄された後、1994年に南アフリカ初の黒人大統領に就任。1993年にノーベル平和賞を受賞。',knowledge:'マンデラは27年間の服役中も法律の勉強を続け、自伝を秘密裏に書き続けた。'},
  {name:'マザー・テレサ',years:'1910-1997',bio:'カトリック修道女・ノーベル平和賞受賞者',quote:'小さな行動で大きな愛を表せ。',profile:'インド・コルカタの貧民街で孤児・病人・瀕死の人々を救う活動を続け、1979年にノーベル平和賞を受賞。',knowledge:'マザー・テレサは晩年、長い間「神の不在を感じる孤独」と戦っていたことが死後の書簡で明らかになった。'},
  {name:'アブラハム・リンカーン',years:'1809-1865',bio:'アメリカ第16代大統領',quote:'あなたが転んでしまったことに関心はない。そこから立ち上がることに関心があるのだ。',profile:'貧しい丸太小屋に生まれ独学で弁護士になり第16代大統領に就任。南北戦争を指導し奴隷解放宣言を発布した。',knowledge:'リンカーンの公式教育は合計1年程度だったが、独学で法律を学び弁護士になった。'},
  {name:'スティーブン・コヴィー',years:'1932-2012',bio:'「7つの習慣」著者',quote:'今日の自分は昨日の選択の結果だ。',profile:'「7つの習慣」は全世界で4000万部以上売れたビジネス書の金字塔。「重要なことを先に行う」などの原則で知られる。',knowledge:'コヴィーは「重要性と緊急性」の4つの象限を広めた。多くの人は緊急なことに時間を使いすぎて重要なことを後回しにしてしまうと説いた。'},
  {name:'ジェームズ・クリア',years:'1986年生まれ',bio:'習慣研究者・「Atomic Habits」著者',quote:'1%の改善を毎日続ければ、1年で37倍になる。',profile:'著書「Atomic Habits」は全世界で1500万部以上売れた。「習慣の積み重ねが人格を作る」というメッセージで世界中の人々に影響を与えている。',knowledge:'1日1%の改善を365日続けると1.01の365乗＝37.78倍になる。逆に1日1%悪化すると0.99の365乗＝0.03まで落ちる。'},
  {name:'大谷翔平',years:'1994年生まれ',bio:'MLB選手・投打の二刀流',quote:'今この瞬間に全力を尽くす。それだけだ。',profile:'2021年・2023年のMLB MVPを受賞。ベーブ・ルース以来の真の二刀流選手として歴史に名を刻んでいる。',knowledge:'大谷は高1のとき「マンダラチャート」で「ドラフト1位で8球団から指名される」という目標を掲げ、その通りになった。'},
  {name:'羽生善治',years:'1970年生まれ',bio:'将棋棋士・永世七冠',quote:'プロとは自分が誓ったからやる人間のことだ。',profile:'史上初の七冠同時制覇を達成。タイトル通算99期獲得という前人未到の記録を持つ。AIの台頭後も第一線で活躍し続ける。',knowledge:'羽生は将棋の局面は10の220乗という天文学的な数の可能性があると述べた。チェス（10の120乗）を大幅に上回る。'},
  {name:'藤井聡太',years:'2002年生まれ',bio:'将棋棋士・八冠',quote:'一手一手を大切に指すことが将棋の真髄だ。',profile:'2023年に前人未到の八冠同時制覇を達成。AIを活用した研究で新時代の将棋を開拓している。',knowledge:'藤井聡太はデビュー後に29連勝という史上最多連勝記録を達成した。'},
  {name:'渋沢栄一',years:'1840-1931',bio:'日本資本主義の父',quote:'道徳と経済の一致を図ることなしに、真の繁栄はない。',profile:'500以上の企業・600以上の社会事業の設立に関わった。2024年から一万円紙幣の肖像に採用。',knowledge:'渋沢は500社以上の企業設立に関わりながら、どの会社の株も過半数は保有しないというポリシーを持っていた。'},
  {name:'本田宗一郎',years:'1906-1991',bio:'Honda創業者',quote:'失敗したところでやめるから失敗になる。成功するまで続ければ成功になる。',profile:'戦後の焼け野原から自転車にエンジンを取り付けたバイクを作り始め、世界最大のオートバイメーカーへと育て上げた。',knowledge:'本田は小学校卒業の学歴しかなかったが、名誉卒業証書を「額縁に入れても食べられない」と言ってその場に置いてきた。'},
  {name:'松下幸之助',years:'1894-1989',bio:'パナソニック創業者',quote:'素直な心で学べば、どんな人からも学べる。',profile:'小学校中退、丁稚奉公から出発し、松下電気器具製作所（現パナソニック）を創業。「経営の神様」と称された。',knowledge:'松下は「自分には学歴がない、健康でない、お金がない—だからこそ人に頼り、人から学ぶことができた」と語った。'},
  {name:'吉田松陰',years:'1830-1859',bio:'思想家・教育者',quote:'志を立てて、以て万事の源となす。',profile:'松下村塾を開き、伊藤博文・山縣有朋・高杉晋作など明治維新を担う多くの人材を育てた。',knowledge:'松陰は30年の短い生涯で約700冊の本を読んだとされる。獄中でも学びをやめず囚人仲間に講義を行った。'},
  {name:'坂本龍馬',years:'1836-1867',bio:'幕末の志士',quote:'世の中の人は何とも言わば言え。我が成すことは我のみぞ知る。',profile:'薩長同盟の締結に奔走し、大政奉還の実現に貢献した幕末の英雄。31歳で暗殺された。',knowledge:'龍馬は日本で最初に新婚旅行をした人物とされる。妻のおりょうと鹿児島に出かけた旅が「日本最初の新婚旅行」といわれている。'},
  {name:'宮本武蔵',years:'1584-1645',bio:'剣豪・哲学者',quote:'千日の稽古をもって鍛とし、万日の稽古をもって錬とす。',profile:'佐々木小次郎との巌流島の決闘で有名。晩年に著した「五輪書」は現代でもビジネス書として世界中で読まれる。',knowledge:'武蔵は「二天一流」という両手に刀を持つ二刀流を開発した。生涯無敗とされ60回以上の決闘に勝利したとされる。'},
  {name:'徳川家康',years:'1543-1616',bio:'江戸幕府初代将軍',quote:'人の一生は重荷を負うて遠き道を行くがごとし。急ぐべからず。',profile:'幼少期を人質として過ごし、関ヶ原の戦いで勝利し江戸幕府を開いた。260年以上続く江戸時代の礎を築いた。',knowledge:'家康は非常に健康に気を使い、自ら薬草を研究・調合した。73歳まで現役で政治を行った。'},
  {name:'織田信長',years:'1534-1582',bio:'戦国武将',quote:'是非もなし。',profile:'「天下布武」を掲げ、鉄砲の集団戦法など革新的な軍事戦略で戦国時代の覇者となった。本能寺の変で明智光秀に討たれた。',knowledge:'信長は黒人家臣「弥助」を侍に取り立てたことは日本史における異文化受容の象徴的エピソードとして世界的に有名。'},
  {name:'ヴィクトル・フランクル',years:'1905-1997',bio:'精神科医・「夜と霧」著者',quote:'意味を見つけた者は、どんな状況にも耐えられる。',profile:'ホロコーストを生き延び、その体験を「夜と霧」に著した。「ロゴセラピー（意味による治療）」を創始した。',knowledge:'フランクルはアウシュビッツに移送される直前、アメリカへのビザを手に入れた。しかし年老いた両親を置いて逃げることができず、ビザを破棄してナチスに連行された。'},
  {name:'マルクス・アウレリウス',years:'121-180年',bio:'ローマ皇帝・哲学者',quote:'今日一日を十分に生きよ。',profile:'ローマ皇帝でありながら哲学者として「自省録」を著した。ストア哲学の実践者として知られる。',knowledge:'「自省録」はアウレリウスが自分自身のために書いたメモであり、出版を意図していなかった。'},
  {name:'セネカ',years:'紀元前4年-65年',bio:'ローマのストア哲学者',quote:'人生は短い。しかし、十分に使えば十分に長い。',profile:'ローマの哲学者・劇作家・政治家。「人生の短さについて」などの著作でストア哲学の実践を説いた。最後はネロに自殺を命じられた。',knowledge:'セネカは「人生が短いのではなく、我々が人生を無駄にしている」と説いた。'},
  {name:'チャールズ・ダーウィン',years:'1809-1882',bio:'生物学者・進化論の父',quote:'最終的に生き残るのは、最も強い種でも最も賢い種でもなく、変化に最もよく適応した種だ。',profile:'ビーグル号での世界一周調査の後、「種の起源」を発表し進化論を提唱した。すべての生物は共通の祖先から変化して生まれたという考えは近代生物学の基礎となった。',knowledge:'ダーウィンは「種の起源」の出版を20年以上躊躇し続けた。アルフレッド・ウォレスが同様の理論を完成させたという知らせを受けてようやく出版を決意した。'},
  {name:'ルイ・パスツール',years:'1822-1895',bio:'微生物学の父',quote:'チャンスは準備ができている人のところにやってくる。',profile:'細菌が発酵・腐敗・感染症を引き起こすことを証明し「パスツール滅菌法」を開発。狂犬病・炭疽病ワクチンの開発にも成功した。',knowledge:'パスツールは脳卒中で半身不随になったにもかかわらず研究を続けた。'},
  {name:'アイザック・ニュートン',years:'1643-1727',bio:'物理学者・数学者',quote:'私が遠くを見渡せたとしたら、それはただ巨人の肩の上に立っていたからだ。',profile:'万有引力の法則・運動の三法則を発見し微積分を独立に発明した。科学史上最大の天才のひとりとされる。',knowledge:'ニュートンは「まだ発見されていない真理という広大な海のほとりで貝殻を拾っている少年のようなものだ」と語った。'},
  {name:'ガリレオ・ガリレイ',years:'1564-1642',bio:'物理学者・天文学者',quote:'それでも地球は動く。',profile:'望遠鏡を改良して天体を観測し地動説を支持した。慣性の法則・落体の法則を発見し近代科学の礎を築いた。',knowledge:'ガリレオは宗教裁判で地動説を撤回させられた後も軟禁状態の中で「新科学対話」を完成させ、こっそりオランダで出版させた。'},
  {name:'ニコラ・テスラ',years:'1856-1943',bio:'電気技術者・発明家',quote:'現在は未来のものだ。',profile:'交流電流システム・誘導電動機・テスラコイルなど多くの発明で電気文明を革命的に変えた。エジソンのライバルとして「電流戦争」を繰り広げた。',knowledge:'テスラはニューヨークのホテルに33年間暮らし毎晩ひとりで夕食をとった。晩年は極貧のうちに死んだが業績は死後に正当に評価された。'},
  {name:'フョードル・ドストエフスキー',years:'1821-1881',bio:'ロシアの小説家',quote:'人間は苦しみの中でこそ、最も深く生きる。',profile:'「罪と罰」「白痴」「カラマーゾフの兄弟」などで人間の深淵を描いた。死刑判決を受けて処刑場に立ったが直前に特赦となりシベリア送りになった。',knowledge:'ドストエフスキーはギャンブル依存症で全財産を何度も失った。しかし逆説的に追い詰められた状況が彼の創作を促した。'},
  {name:'レフ・トルストイ',years:'1828-1910',bio:'ロシアの小説家・思想家',quote:'物事を変えたければ、まず自分が変われ。',profile:'「戦争と平和」「アンナ・カレーニナ」「復活」などの大作を著した。晩年は無所有・非暴力・菜食主義を実践した。',knowledge:'トルストイは82歳のとき家族との軋轢から家を飛び出し、旅の途中の駅で死んだ。その劇的な最期は世界中に電報で伝えられた。'},
  {name:'カール・ユング',years:'1875-1961',bio:'分析心理学の創始者',quote:'無意識を意識にすれば、それがあなたの人生を導く。',profile:'「元型」「集合的無意識」「内向性・外向性」などの概念を提唱し現代心理学・文化に多大な影響を与えた。',knowledge:'ユングは晩年スイス・ボーリンゲンに電気・水道・ガスを引かない塔を建てて隠遁した。「内なる自己と向き合う」実践の場として大切にした。'},
  {name:'ウィリアム・ジェームズ',years:'1842-1910',bio:'心理学者・哲学者',quote:'行動が感情を変える。感情を変えたければ、まず行動せよ。',profile:'プラグマティズム哲学を確立し「心理学の父」とも呼ばれる。「思考が変われば行動が変わる」という連鎖の概念は現代の自己啓発の基礎になった。',knowledge:'ジェームズは若いころ深刻な抑うつに悩み自殺を考えた時期もあったが「意志の力によって人生を変えられる」という信念を持ち哲学・心理学の研究に人生を捧げた。'},
  {name:'ナポレオン・ヒル',years:'1883-1970',bio:'自己啓発作家',quote:'思考は現実化する。',profile:'アンドリュー・カーネギーの紹介で500人以上の成功者を取材し「Think and Grow Rich（思考は現実化する）」を著した。全世界で1億冊以上売れた自己啓発の聖典。',knowledge:'ヒルは「マスターマインド」という概念を提唱した。2人以上の人が共通の目的に向かって協力するとき単独では生まれない「第三の知性」が生まれるという考え。'},
  {name:'デール・カーネギー',years:'1888-1955',bio:'「人を動かす」著者',quote:'人を動かすには、相手の心から動きたいという気持ちを引き出すことだ。',profile:'「人を動かす」「道は開ける」は合計で1億冊以上売れたベストセラー。ミズーリ州の貧しい農家に生まれ独学でコミュニケーション術を磨いた。',knowledge:'カーネギーは「人の名前を覚えることが最も基本的な礼儀だ」と説いた。'},
  {name:'イーロン・マスク',years:'1971年生まれ',bio:'Tesla・SpaceX CEO',quote:'失敗は選択肢のひとつだ。失敗していないなら、十分に革新していない。',profile:'Tesla・SpaceX・X（旧Twitter）などを率いる。電気自動車の普及と火星移住計画を現実に近づけている。',knowledge:'マスクはSpaceXで従来の宇宙開発コストを90%以上削減した。ロケット本体の再利用に成功し宇宙開発のコストを革命的に下げた。'},
  {name:'ジェフ・ベゾス',years:'1964年生まれ',bio:'Amazon創業者',quote:'失敗と発明は切り離せない双子だ。',profile:'1994年にガレージでAmazonを創業し世界最大のEコマース企業に育てた。「地球上で最も顧客中心の企業になる」というビジョンを掲げる。',knowledge:'ベゾスは「80歳になったとき、やらなかったことを後悔したくない」という考え方（後悔最小化フレームワーク）でAmazon創業を決断したと語っている。'},
  {name:'ジム・ロン',years:'1930-2009',bio:'起業家・モチベーション講師',quote:'あなたが読む本と付き合う人が、5年後の自分を作る。',profile:'貧しい農家の出身から成功哲学を説く講師として世界中で6000万人以上に影響を与えた。アンソニー・ロビンズなどの師匠としても知られる。',knowledge:'ロンは「人は付き合う5人の平均値になる」という法則を説いた。'},
  {name:'マーク・ザッカーバーグ',years:'1984年生まれ',bio:'Meta（Facebook）創業者',quote:'最大のリスクはリスクを冒さないことだ。',profile:'ハーバード在学中にFacebook（現Meta）を創業し世界最大のSNSプラットフォームに育て上げた。毎年「個人的な課題」を設定することで知られる。',knowledge:'ザッカーバーグは毎年個人的な挑戦（中国語学習・本を毎週1冊読む・毎日走るなど）を設定し公表している。'},
  {name:'ビル・ゲイツ',years:'1955年生まれ',bio:'Microsoft共同創業者',quote:'成功を祝うのはいいが、失敗から学ぶことの方が重要だ。',profile:'ポール・アレンとMicrosoftを共同創業しPCのOS「Windows」で世界制覇した。現在は「ビル&メリンダ・ゲイツ財団」を通じて世界的な医療・貧困問題に取り組む。',knowledge:'ゲイツはハーバード大学に入学したがMicrosoftを設立するために中退した。その後ハーバードは彼に名誉博士号を授与した。'},
  {name:'孫正義',years:'1957年生まれ',bio:'ソフトバンク創業者',quote:'夢は大きく、行動は細かく。',profile:'ソフトバンクを創業し携帯電話・インターネット・AIへの大胆な投資で日本最大級の企業グループに育て上げた。',knowledge:'孫は19歳のとき1歳から70歳までの計画を詳細に記した人生設計書を作った。'},
  {name:'稲盛和夫',years:'1932-2022',bio:'京セラ・KDDI創業者',quote:'人生・仕事の結果＝考え方×熱意×能力',profile:'京セラ・KDDIを創業しJALの再建も手がけた。「アメーバ経営」を提唱し経営者として高い倫理観と精神性を追求した。',knowledge:'稲盛の方程式では考え方がマイナス（悪意）なら能力・熱意がどれだけ高くても結果はマイナスになる。'},
  {name:'柳井正',years:'1949年生まれ',bio:'ユニクロ創業者',quote:'一勝九敗。',profile:'父親から受け継いだ小さな洋品店をグローバルブランド「ユニクロ」に育て上げた。失敗をおそれず挑戦し続けることの重要性を説く。',knowledge:'柳井は「安くて良いものを大量に売る」という逆転の発想で業界の常識を覆した。'},
  {name:'夏目漱石',years:'1867-1916',bio:'小説家・英文学者',quote:'智に働けば角が立つ。情に棹させば流される。とかく人の世は住みにくい。',profile:'「吾輩は猫である」「坊っちゃん」「こころ」など日本近代文学の名作を生み出した。晩年は「則天去私」を人生の理念とした。',knowledge:'漱石は英国留学中に神経衰弱に陥り帰国後、朝日新聞に入社して専業作家になった。'},
  {name:'宮沢賢治',years:'1896-1933',bio:'詩人・童話作家',quote:'世界がぜんたい幸福にならないうちは個人の幸福はあり得ない。',profile:'「銀河鉄道の夜」「注文の多い料理店」など独自の世界観を持つ作品を残した。農業学校の教員として働きながら創作を続け37歳で病没した。',knowledge:'宮沢賢治は生前ほぼ無名で自費出版した詩集はほとんど売れなかった。作品が再評価されたのは死後のことだった。'},
  {name:'岡本太郎',years:'1911-1996',bio:'芸術家',quote:'芸術は爆発だ。',profile:'パリでピカソの絵に衝撃を受け帰国後に独自の前衛芸術を開拓。大阪万博の「太陽の塔」は代表作。',knowledge:'岡本太郎は「芸術は上手くなくていい。むしろ下手でいい」と言い続け、評価を求めず自分のスタイルを貫いた。'},
  {name:'手塚治虫',years:'1928-1989',bio:'漫画の神様',quote:'人間は皆、最後まで走り続けなければならない。',profile:'「鉄腕アトム」「ブラック・ジャック」「火の鳥」などを著し「漫画の神様」と称される。日本のストーリー漫画の基礎を築いた。',knowledge:'手塚は生涯に700作品以上、総ページ数15万ページ以上の漫画を描いた。入院中も点滴を打ちながら描き続け「僕の仕事を取り上げないでくれ」という言葉を残して60歳で亡くなった。'},
  {name:'黒澤明',years:'1910-1998',bio:'映画監督',quote:'完璧な映画を作ることよりも、今日も映画を作り続けることだ。',profile:'「羅生門」「七人の侍」「生きる」などで世界映画史に名を刻んだ。スピルバーグ・ルーカスなど世界の名監督が師と仰ぐ。',knowledge:'「七人の侍」の撮影は1年以上かかり予算は当初の10倍に膨らんだ。制作会社が中止を命じたが黒澤は「やめるなら死ぬ」と言い張って完成させた。'},
  {name:'福沢諭吉',years:'1835-1901',bio:'啓蒙思想家・慶應義塾創設者',quote:'天は人の上に人を造らず、人の下に人を造らずと言えり。',profile:'慶應義塾（現慶應義塾大学）を創設。「学問のすすめ」で西洋の合理主義思想を日本に広め明治維新後の近代化に貢献した。',knowledge:'福沢諭吉は下級武士の家に生まれ身分の差で常に不当な扱いを受けたことが平等の精神を育んだ。'},
  {name:'伊能忠敬',years:'1745-1818',bio:'測量家・地図製作者',quote:'地道な努力が、歴史を変える地図を作る。',profile:'55歳から全国測量の旅を始め17年かけて日本初の精密な全国地図「大日本沿海輿地全図」を完成させた。',knowledge:'忠敬が50代から学び始めて歩いた距離は約4万km（地球1周に相当）といわれる。'},
  {name:'北里柴三郎',years:'1853-1931',bio:'細菌学者・医師',quote:'病に勝るものは予防なり。',profile:'破傷風菌の純粋培養と血清療法を発見。ペスト菌の発見でも名声を得た。2024年から千円紙幣の肖像。',knowledge:'北里は帰国後東京大学医学部と対立し孤立したが、福沢諭吉の支援を受けて伝染病研究所を設立した。'},
  {name:'湯川秀樹',years:'1907-1981',bio:'日本人初のノーベル物理学賞受賞者',quote:'科学は不思議に思うことから始まる。',profile:'中間子理論を予言し1949年に日本人初のノーベル物理学賞を受賞。敗戦直後の日本に希望を与えた「昭和の英雄」。',knowledge:'湯川は中間子の存在を理論的に予言した論文を1934年に発表したが当初は学界に無視された。12年後に実験で発見され予言の正しさが証明された。'},
  {name:'ヴィクトル・ユーゴー',years:'1802-1885',bio:'フランスの詩人・小説家',quote:'最も暗い夜でも、朝は必ずやって来る。',profile:'「レ・ミゼラブル」「ノートルダム・ド・パリ」などの名作で知られる。政治亡命期間中も創作を続けた。',knowledge:'「レ・ミゼラブル」は出版後わずか1日で初版が完売した。'},
  {name:'オスカー・ワイルド',years:'1854-1900',bio:'アイルランドの作家',quote:'自分自身であれ。他の人はみな既にいる。',profile:'「ドリアン・グレイの肖像」「幸福な王子」などで知られる。鋭い社会批評とウィットに富んだ言葉は今も多くの人に引用される。',knowledge:'ワイルドは同性愛を理由に起訴され2年間の重労働刑を受けた。出獄後パリに渡り「De Profundis」を書いた。'},
  {name:'エレノア・ルーズベルト',years:'1884-1962',bio:'人権活動家・元ファーストレディ',quote:'美しい若さは偶然だが、美しい老いは芸術だ。',profile:'フランクリン・ルーズベルト大統領の妻として第二次世界大戦中に活躍。国連世界人権宣言の起草に関わった。',knowledge:'エレノアは幼少期に母親から「みにくい子」と言われて育ったが世界で最も影響力のある女性のひとりになった。'},
  {name:'ヘレン・ケラー',years:'1880-1968',bio:'作家・教育者',quote:'一人で達成できることは小さい。一緒なら多くを達成できる。',profile:'1歳半で視力と聴力を失ったが、アン・サリバン先生の指導で教育を受けラドクリフ大学を卒業した。',knowledge:'ケラーが「water」という言葉を理解した瞬間は映画・舞台「奇跡の人」で有名。言語というものが世界に存在することをその瞬間に理解した。'},
  {name:'モハメド・アリ',years:'1942-2016',bio:'プロボクサー',quote:'チャンピオンはジムで作られるのではない。心の奥底で作られるのだ。',profile:'3度の世界ヘビー級王座を獲得。「蝶のように舞い、蜂のように刺す」の言葉で知られる。ベトナム戦争への反対で徴兵を拒否した。',knowledge:'アリはパーキンソン病で晩年は思うように話せなくなった。しかし1996年のアトランタ五輪の聖火最終ランナーを震える手で務め世界中の人々を感動させた。'},
  {name:'マイケル・ジョーダン',years:'1963年生まれ',bio:'NBAバスケットボール選手',quote:'自分の限界は自分が決める。それが真実だ。',profile:'シカゴ・ブルズで6回のNBA優勝・6回のファイナルMVPを獲得した史上最高の選手。「エア・ジョーダン」ブランドは年間40億ドル以上の売上を誇る。',knowledge:'ジョーダンは高校2年のときバーシティチームのメンバーから外された。その屈辱をバネに猛練習を重ね「カットされた日のことを今も毎朝思い出す」と語っている。'},
  {name:'コービー・ブライアント',years:'1978-2020',bio:'NBAバスケットボール選手',quote:'英雄とは、他の人が眠っているときに練習している人だ。',profile:'LAレイカーズで5回のNBA優勝を果たした。「マンバ・メンタリティ」として知られる勝利への執念と練習への姿勢は今も多くのアスリートの手本となっている。',knowledge:'コービーは毎朝4時に起きて練習することで有名だった。「他の人が眠っている間に練習する。それが差をつける方法だ」という言葉を実践した。'},
  {name:'ウサイン・ボルト',years:'1986年生まれ',bio:'陸上競技選手・人類史上最速',quote:'限界を超えた先に本当の自分がいる。',profile:'100m・200m・4×100mリレーのオリンピック3連覇を達成。100mの世界記録9秒58は現在も破られていない。',knowledge:'ボルトは子供の頃クリケットとサッカーが好きだった。陸上を真剣にやり始めたのは比較的遅く、コーチが強制的に陸上に集中させた。'},
  {name:'セリーナ・ウィリアムズ',years:'1981年生まれ',bio:'テニス選手・グランドスラム23勝',quote:'偉大さは才能から来るのではなく、困難を乗り越える意志から来る。',profile:'23回のグランドスラム優勝を達成した歴代最多勝利数の選手。人種差別・性差別に立ち向かいながら頂点に立ち続けた。',knowledge:'ウィリアムズは2017年の全豪オープン優勝時、妊娠中だったことが後に明らかになった。'},
  {name:'オプラ・ウィンフリー',years:'1954年生まれ',bio:'テレビ司会者・慈善家',quote:'あなたの人生の目的は、あなたの最も大きな才能と、世界の最も大きなニーズが交わる場所で見つかる。',profile:'貧困と虐待の幼少期から世界最大のトーク番組を作り上げた。黒人女性で初の億万長者となった。',knowledge:'オプラは幼少期に祖母に「あなたはスピーチが上手い」と言われたことが自信の源になったと語っている。'},
  {name:'ジョン・F・ケネディ',years:'1917-1963',bio:'アメリカ第35代大統領',quote:'我々が月に行くことを選んだのは、それが簡単だからではなく、困難だからだ。',profile:'第35代大統領として冷戦・キューバ危機・公民権運動などの難題に向き合った。「アポロ計画」を宣言し人類の月面着陸への道を開いた。',knowledge:'ケネディが暗殺されたのは、リンカーン大統領暗殺から100年後のことだった。'},
  {name:'マーガレット・サッチャー',years:'1925-2013',bio:'英国首相',quote:'自分が信じることに対して立ち上がれ。さもなければ何のために生きているのか。',profile:'英国初の女性首相として「鉄の女」の異名を持つ。サッチャリズムと呼ばれる新自由主義的経済政策を推進した。',knowledge:'サッチャーは首相就任前、化学者として研究職に就いていた。'},
  {name:'バラク・オバマ',years:'1961年生まれ',bio:'アメリカ第44代大統領',quote:'変化は下からやってくる。',profile:'アメリカ初の黒人大統領として第44代大統領に就任。「Yes We Can」のスローガンで若者・少数民族の政治参加を促した。2009年にノーベル平和賞を受賞。',knowledge:'オバマはハーバード・ロー・スクールで初の黒人編集長に選ばれた。この実績が注目を集め初の自伝出版につながった。'},
  {name:'ダライ・ラマ14世',years:'1935年生まれ',bio:'チベット仏教の最高指導者',quote:'幸福は外にあるのではなく、内にある。',profile:'1959年に中国によるチベット占領でインドに亡命。非暴力によるチベット独立運動を指導し1989年にノーベル平和賞を受賞。',knowledge:'ダライ・ラマは「科学が仏教の教えを反証したなら、仏教はその教えを変えなければならない」と語った。'},
  {name:'ブッダ（釈迦）',years:'紀元前563-483年頃',bio:'仏教の開祖',quote:'今この瞬間に生きることが、最高の生き方だ。',profile:'王族として生まれ苦行・瞑想を経て悟りを開いた。「四諦八正道」を説き苦しみの原因は執着にあると教えた。仏教は今日世界で5億人以上が信仰する。',knowledge:'ブッダは悟りを開いた後その教えを伝えるべきか迷ったが「理解できる人がいるかもしれない」と考え説法を始めた。'},
  {name:'マルティン・ルター',years:'1483-1546',bio:'宗教改革者',quote:'明日地球が滅びるとしても、今日私はリンゴの木を植える。',profile:'カトリック教会の腐敗を批判する「95カ条の論題」を発表しプロテスタント宗教改革を開始した。聖書をドイツ語に翻訳しドイツ語の標準化に貢献した。',knowledge:'ルターが「95カ条の論題」を発表した1517年10月31日は後にプロテスタントの祭日「宗教改革記念日」になった。'},
  {name:'フローレンス・ナイチンゲール',years:'1820-1910',bio:'近代看護の創始者',quote:'準備なしに好機を待つのは、意味がない。',profile:'クリミア戦争での看護活動と衛生改革で兵士の死亡率を劇的に下げた。世界初の近代看護学校を設立した。',knowledge:'ナイチンゲールはデータビジュアライゼーションのパイオニアでもある。病院の衛生状態と死亡率の関係を「鶏のとさか図」で可視化し政治家を説得した。'},
  {name:'正岡子規',years:'1867-1902',bio:'俳人・歌人',quote:'柿食えば 鐘が鳴るなり 法隆寺',profile:'俳句・短歌の近代的革新を進め「写生」の理念を打ち立てた。脊椎カリエスによる激痛の中でも創作を続け34歳で亡くなった。',knowledge:'子規は野球に熱狂し日本で最初に「野球」という訳語を使った人物のひとりとされる。野球殿堂表彰を受けている。'},
  {name:'新渡戸稲造',years:'1862-1933',bio:'教育家・農学者',quote:'人道の道は一つしかない。人類愛の道だ。',profile:'英語で著した「武士道」は世界的ベストセラーとなり日本精神を世界に紹介した。国際連盟事務次長として国際平和に貢献した。',knowledge:'新渡戸の「武士道」はアメリカで書かれ当初日本語版は存在しなかった。'},
  {name:'野口英世',years:'1876-1928',bio:'細菌学者・医師',quote:'成功の秘訣は忍耐なり。',profile:'幼少期の火傷で左手に障害を持ちながらも苦学し梅毒スピロヘータの純粋培養に成功。ロックフェラー医学研究所で活躍した。',knowledge:'野口英世は医師・弁護士・英語・フランス語など多くの資格・語学を習得した努力家だった。'},
  {name:'松岡修造',years:'1967年生まれ',bio:'元テニス選手・スポーツキャスター',quote:'絶対に熱くなれる! 絶対に可能性はある!',profile:'ウィンブルドンベスト8入りを果たした日本人男子最後のグランドスラムベスト8進出者。現在は「熱血キャスター」として日本中を元気にしている。',knowledge:'松岡修造カレンダーは毎年ベストセラーになっている。彼の一言が多くの日本人のモチベーションの源となっている。'},
  {name:'三浦知良',years:'1967年生まれ',bio:'プロサッカー選手・キング・カズ',quote:'老いることへの恐れより老いることへの準備をせよ。',profile:'「キング・カズ」の愛称で知られJリーグ創立から現在まで現役を続ける超レジェンド。50歳を超えても現役にこだわり続ける。',knowledge:'カズは15歳でブラジルに渡り路上生活を経験しながらサッカーの腕を磨いた。'},
  {name:'羽生結弦',years:'1994年生まれ',bio:'フィギュアスケーター',quote:'自分が納得できるまでやり抜くことが大切だ。',profile:'オリンピック2連覇（2014年・2018年）を達成した史上最高のスケーターのひとり。東日本大震災の被災者でもあり故郷への思いを演技に込め続けている。',knowledge:'羽生は「4回転アクセル」という超高難度のジャンプに挑戦し続けた。北京五輪では転倒したが「挑戦した事実は誰にも消せない」と語った。'},
  {name:'松井秀喜',years:'1974年生まれ',bio:'元プロ野球選手・ゴジラ',quote:'結果が出ないときこそ、焦らず、急がず、諦めず。',profile:'MLBニューヨーク・ヤンキースに移籍し2009年のワールドシリーズMVPを獲得。「ゴジラ」の愛称で日米で愛された。',knowledge:'松井は高校時代、5打席連続で敬遠された甲子園の試合でも表情を変えず相手投手に礼をした。「高校野球史に残る紳士的態度」として語り継がれる。'},
  {name:'中田英寿',years:'1977年生まれ',bio:'元サッカー選手・実業家',quote:'自分で決めた道を、自分の責任で歩め。',profile:'ACミラン・パルマなどのセリエAで活躍した日本人初のワールドクラスMF。引退後は日本文化の発信・伝統工芸の支援など多彩な活動を展開している。',knowledge:'中田は日本人アスリートが「ブランド」として自分を管理した先駆者とされる。'},

let calY,calM,selDay=null,activeId=null,gType='numeric',gCol='#c9a84c',boolV=true,detailOpen=false;
let personIdx=(()=>{const d=new Date();return(d.getFullYear()*365+d.getMonth()*30+d.getDate())%PEOPLE.length;})();
const saveG=()=>localStorage.setItem('hb_goals',JSON.stringify(goals));
const saveL=()=>localStorage.setItem('hb_logs',JSON.stringify(logs));
const saveS=()=>localStorage.setItem('hb_stats',JSON.stringify(stats));
const todayK=()=>{const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;};
const fmtKey=(y,m,d)=>`${y}-${m+1}-${d}`;
function getRank(lv){return RANKS.find(r=>r.lv===lv)||RANKS[RANKS.length-1];}
function addEXP(amount){
  const before=stats.level;stats.exp+=amount;
  let newLv=1;
  for(let i=0;i<RANKS.length;i++){const thr=i===0?0:RANKS[i-1].expNext;if(stats.exp>=thr)newLv=RANKS[i].lv;}
  stats.level=newLv;saveS();
  if(stats.level>before){const r=getRank(stats.level);setTimeout(()=>showToast(`Level Up! Lv.${stats.level} — ${r.name}`),300);}
  else showToast(`+${amount} EXP`);
  updateHeader();
}
function calcStreak(){let s=0;const now=new Date();for(let i=0;i<365;i++){const d=new Date(now);d.setDate(d.getDate()-i);const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;if(logs[k]&&Object.keys(logs[k]).length>0)s++;else break;}return s;}
function checkMissions(){const n=[];for(const m of MISSIONS){if(!stats.earnedMissions.includes(m.id)&&m.check(stats)){stats.earnedMissions.push(m.id);n.push({name:m.name,exp:m.exp});}}if(n.length){saveS();n.forEach((m,i)=>setTimeout(()=>showToast(`Mission: ${m.name}  +${m.exp} EXP`),900+i*600));}}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

const SCREEN_TITLES={today:'Today',missions:'Missions',calendar:'Log',report:'Report',settings:'Settings'};

const openOv=id=>document.getElementById(id).classList.add('open');
const closeOv=id=>document.getElementById(id).classList.remove('open');
function openLog(gid){
  const g=goals.find(x=>x.id===gid);activeId=gid;
  document.getElementById('log-title').textContent=g.name;
  document.getElementById('log-sub').textContent=new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
  const today=todayK();const ex=logs[today]?.[gid];
  let html='';
  if(g.type==='numeric'){html=`<div class="fl">今日の値</div><div style="display:flex;align-items:center;gap:10px;margin-bottom:15px;"><input class="fi" id="lv" type="number" inputmode="decimal" placeholder="0" style="margin:0;flex:1;" value="${ex?.value||''}"><span style="font-size:14px;color:var(--text3);">${g.unit}</span></div><div class="fl">メモ（任意）</div><textarea class="fi" id="lm" rows="2" placeholder="今日の様子を記録">${ex?.memo||''}</textarea>`;}
  else if(g.type==='boolean'){boolV=ex?ex.done:true;html=`<div class="fl">達成しましたか</div><div class="chip-row" style="margin-bottom:15px;"><button class="chip${boolV?' on':''}" id="by" onclick="setBool(true)">達成</button><button class="chip${!boolV?' on':''}" id="bn" onclick="setBool(false)">未達成</button></div><div class="fl">メモ（任意）</div><textarea class="fi" id="lm" rows="2" placeholder="コメント">${ex?.memo||''}</textarea>`;}
  else{html=`<div class="fl">今日の記録</div><textarea class="fi" id="lm" rows="4" placeholder="今日の内容を書いてください">${ex?.memo||''}</textarea>`;}
  document.getElementById('log-body').innerHTML=html;openOv('log-ov');
}
function setBool(v){boolV=v;document.getElementById('by').classList.toggle('on',v);document.getElementById('bn').classList.toggle('on',!v);}
function saveLog(){
  const g=goals.find(x=>x.id===activeId);const today=todayK();
  const isNew=!logs[today]||!logs[today][activeId];
  if(!logs[today])logs[today]={};
  if(g.type==='numeric')logs[today][activeId]={value:parseFloat(document.getElementById('lv').value)||0,memo:document.getElementById('lm')?.value||''};
  else if(g.type==='boolean')logs[today][activeId]={done:boolV,memo:document.getElementById('lm')?.value||''};
  else logs[today][activeId]={memo:document.getElementById('lm')?.value||''};
  saveL();
  if(isNew){stats.totalLogs++;stats.streak=calcStreak();saveS();addEXP(20);checkMissions();}
  closeOv('log-ov');renderHome();
}
function renderHome(){
  const today=todayK();
  document.getElementById('goal-list').innerHTML=goals.map(g=>{
    const log=logs[today]?.[g.id];let sub='',pct=0,showBar=false,isDone=false;
    if(g.type==='numeric'){pct=log?Math.min(100,Math.round((log.value/g.target)*100)):0;sub=log?`${log.value} / ${g.target} ${g.unit}`:`目標: ${g.target} ${g.unit}`;showBar=true;}
    else if(g.type==='boolean'){isDone=!!(log?.done);sub=isDone?'達成':'未記録';}
    else{sub=log?'記録済み':'メモ未記録';}
    const done=isDone||pct>=100;
    return `<div class="goal-row"><div class="goal-dot" style="background:${g.color}"></div><div class="goal-body"><div class="goal-name">${g.name}</div><div class="goal-sub">${sub}</div>${showBar?`<div class="goal-track"><div class="goal-fill" style="width:${pct}%;background:${g.color}"></div></div>`:''}</div><button class="rec-pill${done?' done':''}" onclick="openLog(${g.id})">${done?'完了':'記録'}</button></div>`;
  }).join('');updateHeader();
}
function renderMissions(){
  const wk=getWeekKey();
  const now=new Date();
  document.getElementById('week-label').textContent=`${now.getMonth()+1}月 第${Math.ceil(now.getDate()/7)}週`;
  const {weekly,permanent}=getChallengesForWeek();
  const earned=stats.earnedMissions||[];
  const weekDone=JSON.parse(localStorage.getItem('hb_week_done')||'{}');
  const card=(c,isDone,prog)=>{
    const pct=prog?Math.round(prog.progress/prog.total*100):0;
    return `<div class="challenge-card${isDone?' done':''}">
      <div class="challenge-top">
        <div class="challenge-icon" style="background:${c.bg};color:${c.col}"><i class="ti ${c.icon}"></i></div>
        <div class="challenge-body"><div class="challenge-name">${c.name}</div><div class="challenge-desc">${c.desc}</div></div>
        ${isDone?`<span class="challenge-done-badge">達成</span>`:`<span class="challenge-exp">+${c.exp} EXP</span>`}
      </div>
      ${!isDone?`<div class="challenge-prog"><div class="challenge-prog-fill" style="width:${pct}%;background:${c.col}"></div></div>`:''}
    </div>`;
  };
  document.getElementById('challenges-weekly').innerHTML=weekly.map(c=>{
    const wkey=`${wk}_${c.id}`;
    const isDone=weekDone[wkey];
    const prog=checkChallengeProgress(c,stats,logs);
    if(prog.done&&!isDone){weekDone[wkey]=true;localStorage.setItem('hb_week_done',JSON.stringify(weekDone));if(!earned.includes(wkey)){addEXP(c.exp);}}
    return card(c,prog.done||isDone,prog);
  }).join('');
  document.getElementById('challenges-permanent').innerHTML=permanent.map(c=>{
    const isDone=earned.includes(c.id);
    const prog=checkChallengeProgress(c,stats,logs);
    if(prog.done&&!isDone){stats.earnedMissions.push(c.id);saveS();addEXP(c.exp);}
    return card(c,prog.done,prog);
  }).join('');
}
function chM(dir){calM+=dir;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCal();}
function renderCal(){
  const now=new Date();
  if(calY===undefined){calY=now.getFullYear();calM=now.getMonth();}
  const mns=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-lbl').textContent=`${calY}年 ${mns[calM]}`;
  const first=new Date(calY,calM,1).getDay();const dim=new Date(calY,calM+1,0).getDate();
  const dows=['日','月','火','水','木','金','土'];
  let h=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)h+=`<div></div>`;
  for(let d=1;d<=dim;d++){
    const key=fmtKey(calY,calM,d);
    const isToday=calY===now.getFullYear()&&calM===now.getMonth()&&d===now.getDate();
    const isSel=key===selDay&&!isToday;
    const has=logs[key]&&Object.keys(logs[key]).length>0;
    h+=`<div class="cal-day${isToday?' today':''}${isSel?' selected':''}${has?' has-log':''}" onclick="selectDay('${key}')"><span>${d}</span><span class="pip"></span></div>`;
  }
  document.getElementById('cal-grid').innerHTML=h;
}
function selectDay(key){selDay=key;renderCal();renderDayLog(key);}
function renderDayLog(key){
  if(!key)key=todayK();
  const d=new Date(key.replace(/(\d+)-(\d+)-(\d+)/,'$1/$2/$3'));
  const label=d.toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'long'});
  const dayLogs=logs[key]||{};const entries=Object.entries(dayLogs);
  let html=`<div class="day-log-header"><span class="day-log-date">${label}</span></div>`;
  if(!entries.length){html+=`<div class="day-log-empty">この日の記録はありません。</div>`;}
  else{html+=entries.map(([id,l])=>{const g=goals.find(x=>x.id==id);if(!g)return '';let val='';if(g.type==='numeric')val=`${l.value} ${g.unit}${l.memo?` — ${l.memo}`:''}`;else if(g.type==='boolean')val=`${l.done?'達成':'未達成'}${l.memo?` — ${l.memo}`:''}`;else val=l.memo||'';return `<div class="day-log-row"><div class="day-log-dot" style="background:${g.color}"></div><div><div class="day-log-name">${g.name}</div><div class="day-log-val">${val}</div></div></div>`;}).join('');}
  document.getElementById('day-log-section').innerHTML=html;
}
function renderReport(){
  let days=0,total=0,cnt=0;const now=new Date();const weekRows=[];
  for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const key=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;const c=logs[key]?Object.keys(logs[key]).length:0;if(c>0){days++;total+=c/Math.max(goals.length,1)*100;cnt++;}weekRows.push({label:'日月火水木金土'[d.getDay()],count:c});}
  document.getElementById('st-streak').textContent=`${stats.streak}日`;
  document.getElementById('st-days').textContent=`${days}/7`;
  document.getElementById('st-rate').textContent=cnt?`${Math.round(total/cnt)}%`:'—';
  document.getElementById('st-exp').textContent=`${stats.exp}`;
  const maxC=Math.max(...weekRows.map(r=>r.count),1);
  const period=`${now.getMonth()+1}月第${Math.ceil(now.getDate()/7)}週`;
  document.getElementById('week-report').innerHTML=`<div class="wr-head"><span class="wr-title">今週の記録</span><span class="wr-period">${period}</span></div><div class="wr-bars">${weekRows.map(r=>{const h=Math.max(3,Math.round((r.count/maxC)*48));return `<div class="wr-col"><div class="wr-bar${r.count>0?' on':''}" style="height:${h}px"></div><span class="wr-dl">${r.label}</span></div>`;}).join('')}</div>`;
  document.getElementById('goal-reports').innerHTML=goals.map(g=>{let logged=0;for(let i=0;i<30;i++){const d=new Date(now);d.setDate(d.getDate()-i);const key=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;if(logs[key]?.[g.id])logged++;}const pct=Math.round(logged/30*100);return `<div class="goal-report-card"><div class="gr-head"><div class="gr-dot" style="background:${g.color}"></div><div class="gr-name">${g.name}</div><div class="gr-days">${logged}/30日</div></div><div class="gr-track"><div class="gr-fill" style="width:${pct}%;background:${g.color}"></div></div></div>`;}).join('');
}
const openAddGoal=()=>openOv('add-ov');
function selType(btn,t){gType=t;document.querySelectorAll('#type-chips .chip').forEach(c=>c.classList.remove('on'));btn.classList.add('on');document.getElementById('num-opt').style.display=t==='numeric'?'':' none';}
function selCol(el,c){gCol=c;document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('on'));el.classList.add('on');}
function saveGoal(){const name=document.getElementById('g-name').value.trim();if(!name)return;const g={id:Date.now(),name,type:gType,color:gCol};if(gType==='numeric'){g.target=parseFloat(document.getElementById('g-target').value)||0;g.unit=document.getElementById('g-unit').value||'';}goals.push(g);saveG();closeOv('add-ov');document.getElementById('g-name').value='';renderHome();renderMgr();}
function renderMgr(){
  document.getElementById('goals-mgr').innerHTML=goals.map(g=>`
    <div class="settings-row">
      <div class="settings-icon-wrap" style="background:${g.color}22;color:${g.color};"><i class="ti ${g.type==='numeric'?'ti-chart-line':g.type==='boolean'?'ti-check':'ti-pencil'}"></i></div>
      <div class="settings-label-wrap"><div class="settings-label">${g.name}</div><div class="settings-sub">${g.type==='numeric'?`目標 ${g.target} ${g.unit}`:g.type==='boolean'?'達成 / 未達成':'メモ'}</div></div>
      <button style="background:none;border:none;cursor:pointer;color:var(--red);font-size:13px;padding:4px 8px;font-family:inherit;" onclick="delGoal(${g.id})">削除</button>
    </div>`).join('');
  // profile
  const prof=JSON.parse(localStorage.getItem('hb_profile')||'{}');
  document.getElementById('profile-name-disp').textContent=prof.name||'未設定';
  // theme
  const dark=localStorage.getItem('hb_theme')!=='light';
  document.getElementById('theme-toggle').classList.toggle('on',dark);
  // notif
  const notifOn=localStorage.getItem('hb_notif')==='on';
  document.getElementById('notif-toggle').classList.toggle('on',notifOn);
  document.getElementById('notif-knob');
  document.getElementById('notif-time-row').style.display=notifOn?'flex':'none';
  document.getElementById('notif-sub').textContent=notifOn?`毎日 ${localStorage.getItem('hb_notif_time')||'21:00'} に通知`:'オフ';
}
function delGoal(id){goals=goals.filter(g=>g.id!==id);saveG();renderMgr();renderHome();}

// ── THEME ──────────────────────────────────────────────────────
function applyTheme(){
  const light=localStorage.getItem('hb_theme')==='light';
  if(light){
    document.documentElement.style.setProperty('--bg','#ffffff');
    document.documentElement.style.setProperty('--bg2','#f5f5f5');
    document.documentElement.style.setProperty('--bg3','#ececec');
    document.documentElement.style.setProperty('--text','#111111');
    document.documentElement.style.setProperty('--text2','#444444');
    document.documentElement.style.setProperty('--text3','#888888');
    document.documentElement.style.setProperty('--border','rgba(0,0,0,0.09)');
    document.documentElement.style.setProperty('--border2','rgba(0,0,0,0.16)');
  } else {
    document.documentElement.style.removeProperty('--bg');
    document.documentElement.style.removeProperty('--bg2');
    document.documentElement.style.removeProperty('--bg3');
    document.documentElement.style.removeProperty('--text');
    document.documentElement.style.removeProperty('--text2');
    document.documentElement.style.removeProperty('--text3');
    document.documentElement.style.removeProperty('--border');
    document.documentElement.style.removeProperty('--border2');
  }
}
function toggleTheme(){
  const isLight=localStorage.getItem('hb_theme')==='light';
  localStorage.setItem('hb_theme',isLight?'dark':'light');
  applyTheme();renderMgr();
  showToast(isLight?'ダークモードに切り替えました':'ライトモードに切り替えました');
}

// ── NOTIFICATION ───────────────────────────────────────────────
function toggleNotif(){
  const isOn=localStorage.getItem('hb_notif')==='on';
  if(!isOn){
    if('Notification' in window){
      Notification.requestPermission().then(p=>{
        if(p==='granted'){
          localStorage.setItem('hb_notif','on');
          scheduleNotif();
          showToast('通知をオンにしました');
        } else {
          showToast('通知の許可が必要です（設定から変更してください）');
        }
        renderMgr();
      });
    } else {
      showToast('このブラウザは通知に非対応です');
    }
  } else {
    localStorage.setItem('hb_notif','off');
    showToast('通知をオフにしました');
    renderMgr();
  }
}
function saveNotifTime(){
  const t=document.getElementById('notif-time-input').value;
  localStorage.setItem('hb_notif_time',t);
  scheduleNotif();
  showToast(`通知時刻を ${t} に設定しました`);
  renderMgr();
}
function scheduleNotif(){
  if(!('serviceWorker' in navigator))return;
  const t=localStorage.getItem('hb_notif_time')||'21:00';
  const [h,m]=t.split(':').map(Number);
  const now=new Date();const next=new Date();
  next.setHours(h,m,0,0);
  if(next<=now)next.setDate(next.getDate()+1);
  const ms=next-now;
  // 簡易タイマー通知（PWAがフォアグラウンドの場合のみ動作）
  clearTimeout(window._notifTimer);
  window._notifTimer=setTimeout(()=>{
    if(Notification.permission==='granted'&&localStorage.getItem('hb_notif')==='on'){
      new Notification('Habitual 🌱',{body:'今日の習慣を記録しましょう！',icon:'/favicon.ico'});
    }
    scheduleNotif();// 次の日のためにスケジュール
  },ms);
}

// ── PROFILE ────────────────────────────────────────────────────
function openProfileEdit(){
  const prof=JSON.parse(localStorage.getItem('hb_profile')||'{}');
  const name=prompt('名前を入力してください',prof.name||'');
  if(name===null)return;
  localStorage.setItem('hb_profile',JSON.stringify({...prof,name:name.trim()||''}));
  renderMgr();
  if(name.trim())showToast(`こんにちは、${name.trim()}さん！`);
}

// ── EXPORT ─────────────────────────────────────────────────────
function exportData(){
  const data={goals,logs,stats,exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`habitual_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('データをエクスポートしました');
}

// ── RANK sub text update ────────────────────────────────────────
function updateHeader(){
  const rank=getRank(stats.level);
  const expTL=stats.level>1?RANKS[stats.level-2].expNext:0;
  const expNext=rank.expNext;
  const pct=expNext>expTL?Math.min(100,Math.round((stats.exp-expTL)/(expNext-expTL)*100)):100;
  const rem=Math.max(0,expNext-stats.exp);
  document.getElementById('exp-disp').textContent=`${stats.exp} EXP`;
  document.getElementById('rank-tag').textContent=`Lv.${stats.level} · ${rank.name}`;
  document.getElementById('lv-badge').textContent=stats.level;
  document.getElementById('lv-name-txt').textContent=rank.name;
  document.getElementById('lv-sub-txt').textContent=rem>0?`次のレベルまで ${rem} EXP`:'最高レベル達成!';
  document.getElementById('lv-pct-txt').textContent=`${pct}%`;
  document.getElementById('lv-fill').style.width=pct+'%';
  document.getElementById('streak-val').textContent=stats.streak;
  document.getElementById('total-val').textContent=stats.totalLogs;
}

stats.streak=calcStreak();
applyTheme();
if(localStorage.getItem('hb_notif')==='on')scheduleNotif();
renderHome();renderPerson();
</script>
